# Auth settings for the deployed app; retain existing local and Vercel preview returns.
# CLI: --workdir supabase/hosted --remote=gpixjzkfovepghpdiikp
project_id = "english-in-action-hosted"
[auth]
site_url = "https://englishainaction.vercel.app"
additional_redirect_urls = [
  "https://englishainaction.vercel.app/auth/confirm",
  "https://englishainaction.vercel.app/definir-clave",
  "http://127.0.0.1:3002/auth/confirm",
  "http://127.0.0.1:3002/definir-clave",
  "https://englishainaction-aredlopez-8250s-projects.vercel.app/",
  "https://englishainaction-aredlopez-8250s-projects.vercel.app/**",
  "https://englishainaction-*-aredlopez-8250s-projects.vercel.app",
  "https://englishainaction-*-aredlopez-8250s-projects.vercel.app/**"
]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true
# Email templates require custom SMTP (or eligible plan) on the hosted project.
# After configuring SMTP, append the sections in email-templates.toml.example.
