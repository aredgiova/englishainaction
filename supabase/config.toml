# Phase 1: PostgreSQL, Auth and local mail. Storage starts in phase 2.
project_id = "english-in-action"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = false
[storage.s3_protocol]
enabled = false
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/confirm", "http://127.0.0.1:3000/definir-clave"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100
token_refresh = 150
token_verifications = 100
[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600
[auth.email.template.invite]
subject = "Tu invitación a English in Action"
content_path = "./supabase/templates/invite.html"
[auth.email.template.recovery]
subject = "Recupera tu acceso a English in Action"
content_path = "./supabase/templates/recovery.html"
[edge_runtime]
enabled = false
[analytics]
enabled = false
